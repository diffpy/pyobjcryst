[build-system]
requires = [
    "scikit-build-core>=0.10",
    "setuptools-scm>=8",
    "nanobind",
    "numpy",
    "libboost-headers",
]
build-backend = "scikit_build_core.build"

[project]
name = "pyobjcryst"
dynamic = ["version"]
authors = [
  { name="Christopher Farrow" },
  { name="Pavol Juhás" },
  { name="Vincent-Favre-Nicolin", email="favre@esrf.fr" },
]
maintainers = [
  {name='Simon Billinge', email='sbillinge@ucsb.edu'},
  { name="Vincent-Favre-Nicolin", email="favre@esrf.fr" },
]
description = "Python bindings to the ObjCryst++ library."
keywords = ['objcryst', 'atom structure crystallography', 'powder diffraction']
readme = "README.rst"
requires-python = ">=3.12, <3.16"
dependencies = ["numpy", "packaging"]
classifiers = [
        'Development Status :: 5 - Production/Stable',
        'Environment :: Console',
        'Intended Audience :: Developers',
        'Intended Audience :: Education',
        'Intended Audience :: Science/Research',
        'License :: OSI Approved :: BSD License',
        'Operating System :: MacOS :: MacOS X',
        'Operating System :: Microsoft :: Windows',
        'Operating System :: POSIX',
        'Operating System :: Unix',
        'Programming Language :: C++',
        'Programming Language :: Python :: 3.12',
        'Programming Language :: Python :: 3.13',
        'Programming Language :: Python :: 3.14',
        'Programming Language :: Python :: 3.15',
        'Topic :: Scientific/Engineering :: Physics',
        'Topic :: Scientific/Engineering :: Chemistry',
        'Topic :: Software Development :: Libraries',
]

[project.urls]
Homepage = "https://github.com/diffpy/pyobjcryst/"
Issues = "https://github.com/diffpy/pyobjcryst/issues/"

[project.scripts]
pyobjcryst = "pyobjcryst.pyobjcryst_app:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.build-type = "Release"
wheel.packages = ["src/pyobjcryst"]
sdist.cmake = true
sdist.exclude = [
    "build",
    "dist",
    ".pytest_cache",
    # Parts of the ObjCryst++ submodule not needed to build the extension.
    "extern/objcryst/Fox",
    "extern/objcryst/test",
    "extern/objcryst/ObjCryst/doc",
    "extern/objcryst/ObjCryst/example",
]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
version_scheme = "no-guess-dev"

# PyPI wheels: ObjCryst++, cctbx and newmat are built from extern/ and linked
# statically, Boost is header-only and nanobind is linked statically, so the
# wheels install into any environment without conda or system libraries.
[tool.cibuildwheel]
build = ["cp312-*", "cp313-*", "cp314-*", "cp315-*"]
skip = ["*-musllinux_*"]
test-requires = ["pytest"]
# The tests open tests/testdata/* relative to the working directory.
test-sources = ["tests"]
test-command = "pytest tests"

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["native"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

# No Windows ARM64 wheels.
[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.codespell]
exclude-file = ".codespell/ignore_lines.txt"
ignore-words = ".codespell/ignore_words.txt"
skip = "*.cif,*.dat"

[tool.docformatter]
recursive = true
wrap-summaries = 72
wrap-descriptions = 72

[tool.black]
line-length = 79
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.rst
  | \.txt
  | _build
  | buck-out
  | build
  | dist
  | blib2to3
  | tests/data
)/
'''
