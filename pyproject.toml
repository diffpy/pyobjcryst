[build-system]
requires = ["scikit-build-core>=0.9", "nanobind", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "pyobjcryst"
# TODO: main uses setuptools-git-versioning (dynamic, tag-based) with
# setuptools.build_meta; scikit-build-core needs a different dynamic-version
# provider to match that exactly. Pinned as a static placeholder for now --
# revisit before release, see nanobind_migration_notes.md.
version = "2026.2.1.dev0"
authors = [
  { name="Christopher Farrow" },
  { name="Pavol Juhás" },
  { name="Vincent-Favre-Nicolin", email="favre@esrf.fr" },
]
maintainers = [
  {name='Simon Billinge', email='sbillinge@ucsb.edu'},
  { name="Vincent-Favre-Nicolin", email="favre@esrf.fr" },
]
description = "Python bindings to the ObjCryst++ library."
keywords = ['objcryst', 'atom structure crystallography', 'powder diffraction']
readme = "README.rst"
requires-python = ">=3.12, <3.15"
dependencies = ["numpy"]
classifiers = [
        'Development Status :: 5 - Production/Stable',
        'Environment :: Console',
        'Intended Audience :: Developers',
        'Intended Audience :: Education',
        'Intended Audience :: Science/Research',
        'License :: OSI Approved :: BSD License',
        'Operating System :: MacOS :: MacOS X',
        'Operating System :: Microsoft :: Windows',
        'Operating System :: POSIX',
        'Operating System :: Unix',
        'Programming Language :: C++',
        'Programming Language :: Python :: 3.12',
        'Programming Language :: Python :: 3.13',
        'Programming Language :: Python :: 3.14',
        'Topic :: Scientific/Engineering :: Physics',
        'Topic :: Scientific/Engineering :: Chemistry',
        'Topic :: Software Development :: Libraries',
]

[project.urls]
Homepage = "https://github.com/diffpy/pyobjcryst/"
Issues = "https://github.com/diffpy/pyobjcryst/issues/"

[project.scripts]
pyobjcryst = "pyobjcryst.pyobjcryst_app:main"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["src/pyobjcryst"]

[tool.codespell]
exclude-file = ".codespell/ignore_lines.txt"
ignore-words = ".codespell/ignore_words.txt"
skip = "*.cif,*.dat"

[tool.docformatter]
recursive = true
wrap-summaries = 72
wrap-descriptions = 72

[tool.black]
line-length = 79
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.rst
  | \.txt
  | _build
  | buck-out
  | build
  | dist
  | blib2to3
  | tests/data
)/
'''
